name: Android CI

on:
  push:
    branches:
      - master
      - copilot-git-*
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # ------------------------------------------------------------
    # JDK 21 (necessário para teu projeto atual)
    # ------------------------------------------------------------
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # ------------------------------------------------------------
    # Garante SDK Android correto (evita quebra futura)
    # ------------------------------------------------------------
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 11076708

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # ------------------------------------------------------------
    # Checagens estáticas rápidas do plano unificado (Fase 6)
    # ------------------------------------------------------------
    - name: Run reliability gate (Fase 6)
      run: ./scripts/phase6_reliability_gate.sh

    # ------------------------------------------------------------
    # Compila e roda os testes de verdade — sem isso o workflow só
    # validava checkout/setup e nunca pegava erro de compilação.
    # ------------------------------------------------------------
    - name: Run tests and build
      run: ./gradlew build --stacktrace
