name: Android CI

on:
  push:
    branches:
      - master
      - copilot-git-*
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    # ------------------------------------------------------------
    # JDK 21 (necessário para teu projeto atual)
    # ------------------------------------------------------------
    - name: Set up JDK 21
      uses: actions/setup-java@v4.5.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # ------------------------------------------------------------
    # Garante SDK Android correto (evita quebra futura)
    # ------------------------------------------------------------
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.2.1
      with:
        cmdline-tools-version: 11076708
