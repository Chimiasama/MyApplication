name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build the APK'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708

      - name: Build APK (FullDebug)
        run: ./gradlew :app:assembleFullDebug -q --console=plain

      - name: Report Kotlin Errors to Summary
        if: failure()
        run: |
          echo "### ❌ Erros de Compilação Encontrados" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          ./gradlew :app:assembleFullDebug --console=plain 2>&1 | grep "e: file://" >> $GITHUB_STEP_SUMMARY || echo "Não foi possível isolar a linha exata. Abra a etapa de build para conferir o log." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Sanitize artifact name
        run: echo "ARTIFACT_NAME=$(echo '${{ github.event.inputs.branch }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: built-apks-${{ env.ARTIFACT_NAME }}
          path: app/build/outputs/apk/**/*.apk
