name: Android Warnings Report

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches: [ "master" ]

jobs:
  warnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Não falha o job: os relatórios (abortOnError=false) sempre são gerados
      # mesmo quando há avisos, e queremos coletá-los de qualquer forma.
      - name: Run Android Lint (full + lite, debug)
        continue-on-error: true
        run: |
          ./gradlew :app:lintFullDebug :app:lintLiteDebug --console=plain 2>&1 | tee lint_output.txt

      - name: Capture Kotlin compiler warnings
        continue-on-error: true
        run: |
          ./gradlew :app:compileFullDebugKotlin :app:compileLiteDebugKotlin \
            --console=plain --rerun-tasks 2>&1 | tee kotlinc_output.txt
          grep -E "^w: " kotlinc_output.txt > kotlinc_warnings.txt || true
          echo "Total de warnings do compilador Kotlin: $(wc -l < kotlinc_warnings.txt)"

      - name: Build Markdown summary
        run: |
          {
            echo "## 🔍 Relatório de Warnings (Android Lint)"
            echo
            python3 scripts/lint_summary.py \
              app/build/reports/lint-results-fullDebug.xml \
              app/build/reports/lint-results-liteDebug.xml
            echo
            echo "## 🛠️ Warnings do compilador Kotlin"
            echo
            if [ -s kotlinc_warnings.txt ]; then
              echo "**Total:** $(wc -l < kotlinc_warnings.txt)"
              echo
              echo '```text'
              cat kotlinc_warnings.txt
              echo '```'
            else
              echo "Nenhum warning do compilador Kotlin encontrado. ✅"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint reports (HTML/XML/text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            lint_output.txt
          if-no-files-found: warn

      - name: Upload Kotlin compiler warnings log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compiler-warnings
          path: |
            kotlinc_output.txt
            kotlinc_warnings.txt
          if-no-files-found: warn

  # Android Lint e o compilador Kotlin não cobrem os avisos que só o
  # inspetor de código do Android Studio mostra (código nunca usado,
  # convenção de nomes, "if" redundante, qualificador redundante, etc.).
  # Qodana roda esse MESMO motor de inspeções do IntelliJ Platform de
  # forma headless, então cobre exatamente essa lacuna.
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Qodana Scan (inspeções de código estilo Android Studio)
        uses: JetBrains/qodana-action@v2026.2.1
        with:
          pr-mode: false
          post-pr-comment: false
          upload-result: true
          artifact-name: qodana-report

      - name: Build Markdown summary
        if: always()
        run: |
          {
            echo "## 🧠 Inspeções de código (Qodana — estilo Android Studio)"
            echo
            python3 scripts/qodana_summary.py "${{ runner.temp }}/qodana/results/qodana.sarif.json"
          } >> "$GITHUB_STEP_SUMMARY"
