name: Android CI (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run reliability gate (Fase 6)
        run: ./scripts/phase6_reliability_gate.sh

      - name: Run tests and build
        run: ./gradlew build -q --console=plain

      - name: Report Kotlin Errors to Summary
        if: failure()
        run: |
          echo "### ❌ Erros de Compilação Encontrados" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          ./gradlew build --console=plain 2>&1 | grep "e: file://" >> $GITHUB_STEP_SUMMARY || echo "Não foi possível isolar a linha exata. Abra a etapa 'Run tests and build' para conferir o log." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
