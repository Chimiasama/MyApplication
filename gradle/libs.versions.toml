[versions]
agp = "8.13.2"
animation = "1.10.0"
appcompat = "1.7.1"
coreSplashscreen = "1.2.0"
coreTesting = "2.2.0"
espressoCoreVersion = "3.7.0"
gson = "2.13.2"
itextg = "5.5.10"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlin = "2.2.21"
composeUiTooling = "1.10.0"
compose = "1.10.0"
kotlinxSerializationJson = "1.9.0"
lifecycleVersion = "2.10.0"
material = "1.13.0"
material3 = "1.4.0"
composeBom = "2025.12.00"
lifecycle = "2.10.0"
activityCompose = "1.12.1"
materialIconsExtended = "1.7.8"
protoliteWellKnownTypes = "18.0.1"
composeMaterial = "1.5.6"
roomCompiler = "2.8.4"
engageCore = "1.5.10"
navigationCommonAndroid = "2.9.6"
navigationComposeAndroid = "2.9.6"
uiTooling = "1.9.3"
uiToolingPreview = "1.10.0"
foundation = "1.10.0"
foundationVersion = "1.10.0"
constraintlayoutCompose = "1.0.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
# AndroidX Core + Lifecycle
androidx-animation = { module = "androidx.compose.animation:animation", version.ref = "animation" }
androidx-appcompat-v171 = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "uiToolingPreview" }
#noinspection SimilarGradleDependency
androidx-compose-ui-tooling-v170 = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUiTooling" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.17.0" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }

androidx-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "coreTesting" }
androidx-espresso-core-v351 = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCoreVersion" }

androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleVersion" }
androidx-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-material-icons-extended-v178 = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
itextg = { module = "com.itextpdf:itextg", version.ref = "itextg" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Jetpack Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

# Activity Compose
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Material Components
material = { module = "com.google.android.material:material", version.ref = "material" }

# Outras libs
protolite-well-known-types = { group = "com.google.firebase", name = "protolite-well-known-types", version.ref = "protoliteWellKnownTypes" }
androidx-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "composeMaterial" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
engage-core = { group = "com.google.android.engage", name = "engage-core", version.ref = "engageCore" }
androidx-navigation-common-android = { group = "androidx.navigation", name = "navigation-common-android", version.ref = "navigationCommonAndroid" }
androidx-navigation-compose-android = { group = "androidx.navigation", name = "navigation-compose-android", version.ref = "navigationComposeAndroid" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundationVersion" }
androidx-constraintlayout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintlayoutCompose" }
